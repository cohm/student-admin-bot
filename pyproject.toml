[project]
name = "student-bot"
version = "0.1.0"
description = "RAG chatbot answering KTH student administrative questions over Mattermost."
requires-python = ">=3.11,<3.13"
dependencies = [
    "pydantic-settings>=2.5",
    "pyyaml>=6.0",
    "python-dotenv>=1.0",
    "click>=8.1",
    "rich>=13.7",

    # Retrieval stack
    # Chroma 1.x is the Rust-core rewrite (chroma-hnswlib gone). The declared
    # range said >=0.6.3,<1.6 while the lock already resolved 1.5.9 — so the
    # floor permitted a silent resolve back to the 0.x client that production
    # no longer runs. Floor at 1.5 to match reality. Existing persist dirs
    # migrate in place on first open (prod made that jump 2026-09-09).
    "chromadb>=1.5,<2",
    "sentence-transformers>=3.0",
    "torch>=2.3",

    # Ingestion
    "pymupdf4llm>=0.0.17",
    "beautifulsoup4>=4.12",
    "lxml>=5.2",

    # Language detection
    "lingua-language-detector>=2.0",

    # LLM
    "ollama>=0.4",
    # HTTP client for the OpenAI-compatible cloud LLM provider (#20). httpx
    # is already a transitive dep (chromadb, fastapi); declared explicitly
    # so the cloud path is robust to upstream churn.
    "httpx>=0.27",

    # Mattermost
    "mattermostdriver>=7.3",
    "websockets>=12.0",

    # Web app & Authentication
    "fastapi>=0.110",
    "uvicorn>=0.30",
    "itsdangerous>=2.2",
    "markdown-it-py>=3.0",
    "authlib>=1.3",
    "joserfc>=1.0",
    "cryptography>=42.0",

    # Per-request memory snapshot (qa_log.rss_mb). Small, well-maintained;
    # already a transitive dep of several other libs in this stack.
    "psutil>=5.9",
]

[project.optional-dependencies]
# Floor at 2.92 (the version this project has been locking) — with a lower
# floor the resolver happily trades docling *down* to 2.87 in order to keep
# websockets at 17.x, since docling-slim's `standard` extra requires
# websockets<17. Nothing here needs websockets 17, docling freshness matters
# more for PDF table parsing, so the floor makes that trade explicit.
docling = ["docling>=2.92"]
dev = [
    "pytest>=8.0",
    "ruff>=0.6",
]

# On Linux, PyPI's default torch wheels target CUDA and pull nvidia-* packages.
# This stack only needs CPU torch inside containers / for embeddings; GPU is optional and unused here.
[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true

[tool.uv.sources]
torch = [{ index = "pytorch-cpu" }]

[project.scripts]
student-bot-cli = "student_bot.bot.pipeline:main"
student-bot = "student_bot.bot.mattermost_client:main"
student-bot-web = "student_bot.web.app:main"
student-bot-reindex = "scripts.reindex:main"
student-bot-stats = "scripts.stats:main"
student-bot-mkuser = "scripts.mkuser:main"
student-bot-backup = "scripts.backup:main"
student-bot-jargon = "scripts.jargon:main"
student-bot-audit-codes = "scripts.audit_course_code_patterns:main"
student-bot-host-metrics = "scripts.host_metrics_collector:main"
student-bot-up = "scripts.up:main"
student-bot-down = "scripts.down:main"
student-bot-fetch-url-corpus = "scripts.fetch_url_corpus:main"
student-bot-replay-failures = "scripts.replay_failures:main"
student-bot-notify = "scripts.notify:main"
student-bot-eval-compare = "scripts.eval_compare:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/student_bot", "scripts", "eval"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
# ruff 0.16 widened its *default* rule set (BLE, FURB, RUF, SIM, ... ~136
# findings here). Pin the historical scope explicitly so bumping ruff stays a
# dependency update instead of a lint refactor. Opting into more rules is a
# deliberate, separate change.
select = ["E4", "E7", "E9", "F"]
