<!doctype html>
<html lang="sv">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>student-bot</title>
<link rel="stylesheet" href="static/style.css?v=44">
<link rel="icon" href="static/favicon.svg?v=1" type="image/svg+xml">
<link rel="icon" href="static/favicon-32.png?v=1" sizes="32x32" type="image/png">
<link rel="apple-touch-icon" href="static/apple-touch-icon.png?v=1">
</head>
<body class="app-shell">
<header>
  <div class="brand">
    <img src="static/KTH_logo_RGB_bla.svg" alt="KTH" class="logo logo-kth">
    <a class="brand-link" href="./"><h1 data-i18n="brand.name"></h1></a>
    <!-- An optional deployment logo is injected here by app.js from
         /api/health.branding_logo_html when web.branding_logo is configured.
         Empty by default — see issue #71. -->
  </div>
  <div class="lang-switch" role="group" aria-label="Language">
    <button type="button" data-lang="sv">SV</button>
    <button type="button" data-lang="en">EN</button>
  </div>
  <p class="tagline" data-i18n="header.tagline"></p>
</header>

<main>
  <div class="notice" role="note">
    <div class="notice-body">
      <p><strong data-i18n="notice.title"></strong><span data-i18n="notice.body"></span><span
         id="notice-model-local" data-i18n="notice.model.local"></span><span
         data-i18n="notice.feedback"></span></p>
    </div>
    <button class="notice-close" type="button" data-i18n-aria="notice.close.aria">×</button>
  </div>

  <section id="onboarding" class="card">
    <h2 data-i18n="onboarding.title"></h2>
    <p data-i18n="onboarding.intro"></p>
    <p class="caveat" data-i18n="onboarding.caveat"></p>
    <p id="cloud-notice-onboarding" class="cloud-notice hidden" role="note"></p>

    <label class="opt-out">
      <input id="opt-out" type="checkbox">
      <span data-i18n="onboarding.optout"></span>
    </label>
    <label class="opt-out">
      <input id="learn-more" type="checkbox">
      <span data-i18n="onboarding.learnmore"></span>
    </label>
    <button id="start" data-i18n="onboarding.start"></button>
  </section>

  <div id="view-tabs" class="view-tabs hidden" role="tablist">
    <button type="button" class="view-tab active" role="tab" data-view="chat"
            aria-selected="true" data-i18n="tabs.chat"></button>
    <button type="button" class="view-tab" role="tab" data-view="debug"
            aria-selected="false" data-i18n="tabs.debug"></button>
  </div>

  <section id="chat" class="card hidden">
    <div id="cloud-notice-chat" class="cloud-notice cloud-notice-banner hidden" role="note"></div>
    <div id="messages" aria-live="polite"></div>
    <form id="composer">
      <textarea id="question" rows="3" data-i18n-placeholder="chat.placeholder" required></textarea>
      <div class="composer-row">
        <span id="status" class="status"></span>
        <div class="composer-actions-col">
          <div class="composer-actions">
            <button type="button" id="export" class="ghost" hidden
                    data-i18n="chat.export" data-i18n-title="chat.export.title"></button>
            <button type="button" id="reset" class="ghost" data-i18n="chat.reset"></button>
            <button type="submit" id="send" data-i18n="chat.send"></button>
          </div>
          <div class="chat-options">
            <label class="chat-option" data-i18n-title="chat.logging.tip">
              <input id="logging-checkbox" type="checkbox">
              <span data-i18n="chat.logging.label"></span>
            </label>
            <label class="chat-option" data-i18n-title="chat.learnmore.tip">
              <input id="learn-more-chat" type="checkbox">
              <span data-i18n="chat.learnmore.label"></span>
            </label>
            <label class="chat-option hidden" id="perf-toggle-wrap" data-i18n-title="perf.toggle.tip">
              <input id="perf-toggle" type="checkbox">
              <span data-i18n="perf.toggle.label"></span>
            </label>
          </div>
        </div>
      </div>
    </form>

    <!-- Resource panel (#74). Below the composer rather than inside it: in the
         composer row it cost 67px of vertical space on every visit, whether or
         not anyone was reading it. Hidden until the checkbox above is ticked. -->
    <div id="perf-panel" class="perf-panel hidden" aria-live="polite">
      <div class="perf-group">
        <span class="perf-label" data-i18n="perf.context" data-i18n-title="perf.tip.context"></span>
        <span id="perf-context" class="perf-value">–</span>
      </div>
      <div class="perf-group">
        <span class="perf-label" data-i18n="perf.server" data-i18n-title="perf.tip.server"></span>
        <span id="perf-server" class="perf-value">–</span>
      </div>
      <div class="perf-group">
        <span class="perf-label" data-i18n="perf.model" data-i18n-title="perf.tip.model"></span>
        <span id="perf-model" class="perf-value">–</span>
      </div>
    </div>
  </section>

  <aside id="debug-panel" class="card" aria-live="polite">
    <div class="debug-panel-head">
      <h2 data-i18n="debug.title"></h2>
    </div>
    <p class="debug-panel-intro" data-i18n="debug.intro"></p>
    <div id="debug-panel-body"></div>
    <p class="debug-panel-empty hidden" id="debug-panel-empty"
       data-i18n="debug.empty"></p>
  </aside>
</main>

<footer>
  <a href="about" data-i18n="footer.about"></a> ·
  <a href="glossary" data-i18n="footer.glossary"></a> ·
  <a href="stats" data-i18n="footer.stats"></a> ·
  <span id="conn"></span>
</footer>

<script src="static/i18n.js?v=42"></script>
<script src="static/notice.js?v=32" defer></script>
<script src="static/app.js?v=41"></script>
</body>
</html>
