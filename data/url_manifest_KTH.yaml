  # of links, with the actual programansvariga list moved to intra.kth.se.
  # The eval caught it — "Vem är PA för CINEK?" dropped out of recall@5 — which
  # is the whole reason that case exists. Seeding the new location restores it.
  # The old www page stays seeded: it is still the public entry point, and
  # keeping both means a future move back does not silently break again.
