  # --- Outward-facing programme descriptions (added 2026-09-12) ---
  #
  # The corpus had no answer to "what IS this programme?". Asked about CTFYS,
  # CINEK, CMAST, CLGYM or CFATE, retrieval returned administrative metadata
  # *about* the programme — the PA contact page, another programme's master
  # mapping table — and passed the gate on it. The descriptions live on these
  # outward-facing pages, which are server-rendered and scrape cleanly.
  #
  # THE STUDY PLANS REMAIN AUTHORITATIVE. These pages also carry master
  # mappings and eligibility claims, and those can be outdated or wrong here.
  # `exclude_sections` drops them at ingest, so they never reach the index and
  # cannot outrank the steering documents. That is deliberate: study-plan
  # chunks are re-scored by the cross-encoder like everything else, so there
  # is no score floor protecting them — corpus chunks have been measured at
  # +4.5 against their +3.5 synthetic start.
  #
  # follow_links MUST stay false. The page links to a "Kurser och
  # masterprogram" sub-page that contains exactly the mapping tables excluded
  # here; following links would pull them straight back in.
  #
  # Start with one programme. Widen to the rest via
  # https://www.kth.se/utbildning/hitta only after confirming that
  # descriptive questions improve and that master-mapping questions still
  # resolve to the study plan.
  - url: https://www.kth.se/utbildning/civilingenjor/teknisk-fysik
    follow_links: false
    max_depth: 1
    include_patterns: []
    exclude_patterns: []
    type_hint: html
    doc_title_override: ""
    exclude_sections: &programme_page_exclusions
      # Authoritative elsewhere — study plans own these.
      - "masterprogram"
      - "beh[öo]righet"
      # Aimed at applicants, not enrolled students.
      - "s[åa] s[öo]ker du"
      - "antas via"
      # Time-sensitive; goes stale between re-scrapes.
      - "viktiga datum"
      # Marketing.
      - "tj[äa]nar"
      - "vad tycker studenter"
      - "studentliv"
      - "mottagning"

  # --- The rest of the programme descriptions (added 2026-09-12) ---
  #
  # CTFYS above proved the shape; these cover the remaining families. Each
  # section index page IS server-rendered with body links (unlike
  # /utbildning/hitta, which is an SPA), so one seed per family with
  # follow_links reaches every programme without listing 76 URLs by hand.
  #
  # include_patterns require a SINGLE slug segment. That is what separates a
  # programme page from /en/studies/master/admissions/... and from the
  # `-1.NNNNN` article pages that share the prefix.

  - url: https://www.kth.se/utbildning/civilingenjor
    follow_links: true
    max_depth: 1
    include_patterns:
      - "^/utbildning/civilingenjor/[a-z0-9-]+$"
    exclude_patterns: []
    type_hint: html
    doc_title_override: ""
    max_pages: 40
    exclude_sections: *programme_page_exclusions

  - url: https://www.kth.se/utbildning/hogskoleingenjor
    follow_links: true
    max_depth: 1
    include_patterns:
      - "^/utbildning/hogskoleingenjor/[a-z0-9-]+$"
    exclude_patterns: []
    type_hint: html
    doc_title_override: ""
    max_pages: 30
    exclude_sections: *programme_page_exclusions

  - url: https://www.kth.se/utbildning/kandidatutbildning
    follow_links: true
    max_depth: 1
    include_patterns:
      - "^/utbildning/kandidatutbildning/[a-z0-9-]+$"
    exclude_patterns: []
    type_hint: html
    doc_title_override: ""
    max_pages: 20
    exclude_sections: *programme_page_exclusions

  # Master programmes are published in ENGLISH ONLY — there is no Swedish
  # equivalent of these pages. Until now the corpus was 100% Swedish, so this
  # is the first English content in it; bge-m3 was chosen precisely because
  # English queries must hit Swedish documents and vice versa.
  #
  # The English pages need their OWN exclusion list: the section names differ,
  # and one of them ("Courses in the programme") is the English counterpart of
  # the syllabus content that must only ever come from the study plans.
  - url: https://www.kth.se/en/studies/master
    follow_links: true
    max_depth: 1
    include_patterns:
      - "^/en/studies/master/[a-z0-9-]+$"
    exclude_patterns: []
    type_hint: html
    doc_title_override: ""
    max_pages: 80
    exclude_sections: &programme_page_exclusions_en
      # Authoritative elsewhere — study plans own these.
      - "courses in the programme"
      - "admissions"
      - "entry requirements"
      # Time-sensitive; stale between scrapes.
      - "application deadline"
      - "next application round"
      # Marketing and site-wide boilerplate that appears as h2 on every page.
      - "meet students"
      - "discover alumni"
      - "next step"
      - "subscribe"
      - "explore our campuses"
      - "explore kth"
      - "why kth"
      - "student life"
      - "browse all programmes"
