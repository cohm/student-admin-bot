services:
  mattermost:
    build:
      context: .
      args:
        STUDENT_BOT_VERSION: ${STUDENT_BOT_VERSION:-}
    image: student-bot:latest
    container_name: student-bot-mm
    restart: unless-stopped
    env_file: .env
    environment:
      OLLAMA_URL: http://host.docker.internal:11434
      # config.yaml paths are relative to project root (STUDENT_BOT_ROOT).
      STUDENT_BOT_ROOT: /app
      # Shared HuggingFace cache: mattermost + web mmap the SAME on-disk model files, so the
      # kernel page-cache keeps ONE physical copy of the weights (and nothing re-downloads).
      HF_HOME: /hfcache
    extra_hosts:
      # On macOS, host.docker.internal already resolves; keep this for Linux parity.
      - "host.docker.internal:host-gateway"
    volumes:
      - ./config.yaml:/app/config.yaml:ro
      # ./data holds dictionary.json, dictionary_proposals.json, logs.sqlite, chroma/, web_users.
      # The Dockerfile COPY of data/dictionary.json is a fallback for `docker run` without compose;
      # this directory mount overrides it.
      - ./data:/app/data
      # Corpus → /app/docs/corpus (paths.docs_dir in config.yaml). Override host path via CORPUS_HOST_PATH in .env
      - ${CORPUS_HOST_PATH:-./docs/corpus}:/app/docs/corpus:ro
      # Shared model cache (see HF_HOME above) — also makes `docker compose run --rm mattermost ... reindex` skip the download.
      - hf_cache:/hfcache
    # Override the default to (re)index instead of running the bot:
    #   docker compose run --rm mattermost python -m scripts.reindex

  # Web UI (authenticated). Start alone: docker compose up -d web
  web:
    build:
      context: .
      args:
        STUDENT_BOT_VERSION: ${STUDENT_BOT_VERSION:-}
    image: student-bot:latest
    container_name: student-bot-web
    restart: unless-stopped
    env_file: .env
    command: ["student-bot-web"]
    environment:
      OLLAMA_URL: http://host.docker.internal:11434
      # config.yaml paths are relative to project root (STUDENT_BOT_ROOT).
      STUDENT_BOT_ROOT: /app
      WEB_BIND_HOST: "0.0.0.0"
      WEB_AUTH_ENABLED: "true"
      # Served at root on the dedicated subdomain (chatbot.particle.kth.se). See ms02-work-setup.md §9.14.
      WEB_BASE_PATH: ""
      # Shared HuggingFace cache (see mattermost service).
      HF_HOME: /hfcache
    ports:
      # Loopback only — Caddy (on this VM) fronts it on :443.
      - "127.0.0.1:8000:8000"
    extra_hosts:
      - "host.docker.internal:host-gateway"
    volumes:
      - ./config.yaml:/app/config.yaml:ro
      - ./data:/app/data
      - ${CORPUS_HOST_PATH:-./docs/corpus}:/app/docs/corpus:ro
      - hf_cache:/hfcache

  # Maintenance only — the ONE place the corpus is mounted read-write.
  #
  # `student-bot-fetch-url-corpus` writes scraped markdown into docs/corpus,
  # so it cannot run in `web` or `mattermost`: both mount the corpus `:ro` on
  # purpose, because the running app must never modify its own knowledge base.
  # Trying it there fails with "Read-only file system".
  #
  # Behind a profile, so `docker compose up -d` never starts it — it has no
  # long-running command and would exit immediately. Run it explicitly:
  #
  #     docker compose run --rm scrape
  #
  # then reindex (which writes data/chroma, already read-write) with:
  #
  #     docker compose run --rm web python -m scripts.reindex
  #
  # On a host without `uv` this is the only way to refresh the corpus. Files
  # land root-owned, which is fine where every corpus operation goes through a
  # container, but would block a later host-side scrape on a host that has uv.
  scrape:
    profiles: ["tools"]
    build:
      context: .
      args:
        STUDENT_BOT_VERSION: ${STUDENT_BOT_VERSION:-}
    image: student-bot:latest
    env_file: .env
    command: ["student-bot-fetch-url-corpus"]
    environment:
      STUDENT_BOT_ROOT: /app
    extra_hosts:
      - "host.docker.internal:host-gateway"
    volumes:
      - ./config.yaml:/app/config.yaml:ro
      # Writes url_source_map.json and url_filtered_links_report.json here.
      - ./data:/app/data
      # Read-WRITE, unlike every other service. This is the whole point.
      - ${CORPUS_HOST_PATH:-./docs/corpus}:/app/docs/corpus

volumes:
  hf_cache:
