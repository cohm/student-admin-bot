name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  lint:
    name: Ruff lint + format
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Install uv
        uses: astral-sh/setup-uv@v10.0.1
        with:
          enable-cache: true

      # --locked: fail if uv.lock is out of date with pyproject.toml rather
      # than silently re-resolving. Without it CI can pass against versions that
      # were never committed, which is half of how #87 went unnoticed.
      - name: Sync dependencies (with dev extra)
        run: uv sync --locked --extra dev

      # Use the ruff pinned in uv.lock (not the latest release) so CI and local
      # `uv run ruff` agree. `uv tool run ruff` pulled whatever was newest and
      # drifted ahead of the repo's pin, failing on rules the project doesn't use.
      - name: Ruff lint
        run: uv run ruff check .

      - name: Ruff format (check)
        run: uv run ruff format --check .

  lockfile:
    name: Lockfile guard
    runs-on: ubuntu-latest
    # Only meaningful against a base branch; a push to main has nothing to
    # compare against.
    if: github.event_name == 'pull_request'
    steps:
      - uses: actions/checkout@v7
        with:
          # Need the base branch's uv.lock, so fetch enough history to read it.
          fetch-depth: 0

      - name: Install uv
        uses: astral-sh/setup-uv@v10.0.1
        with:
          enable-cache: true

      - name: Sync dependencies (with dev extra)
        run: uv sync --locked --extra dev

      # PR #87 shipped four silent downgrades: one wrong digit in a version
      # ceiling walked chromadb, tokenizers, transformers and huggingface-hub
      # back about a year, and the lock kept them long after the ceiling was
      # fixed. `uv lock` does not undo that on its own — the old version still
      # satisfies the corrected range, so uv keeps it as a preference.
      - name: Extract base uv.lock
        run: git show "origin/${{ github.base_ref }}:uv.lock" > /tmp/base-uv.lock

      - name: Check for dependency downgrades
        env:
          PR_BODY: ${{ github.event.pull_request.body }}
        run: uv run python -m scripts.check_lock_downgrades --base /tmp/base-uv.lock

  build:
    name: Tests + build (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12"]
    steps:
      - uses: actions/checkout@v7

      - name: Install uv
        uses: astral-sh/setup-uv@v10.0.1
        with:
          enable-cache: true

      - name: Set up Python ${{ matrix.python-version }}
        run: uv python install ${{ matrix.python-version }}

      # pyproject.toml pins torch to the CPU-only index for Linux; no extra env needed.
      # --locked: fail if uv.lock is out of date with pyproject.toml rather
      # than silently re-resolving. Without it CI can pass against versions that
      # were never committed, which is half of how #87 went unnoticed.
      - name: Sync dependencies (with dev extra)
        run: uv sync --locked --extra dev

      # Imports the full package via the CLI entry point — fails fast on any
      # ImportError without needing the corpus, Chroma index, or Ollama.
      - name: Smoke import (CLI --help)
        run: uv run student-bot-cli --help

      # Runs on both supported Pythons because this job already syncs the dev
      # extra for each. The suite is unit-level — fixtures only, no LLM, no
      # Chroma, no Ollama — and takes a few seconds.
      #
      # Added late: the suite existed but nothing ran it, so
      # test_fallback_fills_missing_block_from_prior_cohort stayed red for four
      # months after a deliberate citation-format change landed under it. A
      # test suite nobody runs is documentation, not a gate.
      - name: Unit tests
        run: uv run pytest -q

      - name: Build sdist + wheel
        run: uv build
